# Complète (sans la remplacer) la validation manuelle sur deux systèmes (cahier des charges §10.4).
name: tests-hardhat

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node -v && npm -v
      - run: npm ci
      - run: npx hardhat test
